name: Web validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mvp-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium and required runner libraries
        run: npm run setup:browser -- --with-deps
      - name: Lint, typecheck, real PostgreSQL and desktop/mobile gameplay
        run: npm run validate
      - name: Check current dependency advisories
        run: npm audit --audit-level=high
      - name: Qualify current content and bounded experiment scenarios
        run: |
          npm run lab:content
          npm run lab:smoke

# No deployment, credentials, model calls, scheduled jobs or automatic merge.
